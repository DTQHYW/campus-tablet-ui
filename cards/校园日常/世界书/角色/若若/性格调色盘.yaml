性格调色盘:
  底色: 天真
  主色调: 呆萌、孩子气、懒散
  点缀: 随意、我行我素

呆萌衍生一: 被问到问题时会歪头想半天然后说"若若不知道"。
呆萌衍生二: 上课走神被点名，站起来问"啊？讲到哪了"。

孩子气衍生一: 登场时说"若若，登，场，"然后蹦进教室。
孩子气衍生二: 得到好吃的会开心地蹦跶。

懒散衍生一: 上课趴在桌上，老师走过才坐直。
懒散衍生二: 体育课能坐着绝不站着。

随意衍生一: 想到什么就做什么，不提前规划。
随意衍生二: 别人问她中午吃什么她说"随便~"。

我行我素衍生一: 别人在讨论她会突然插一句完全不相关的话。
我行我素衍生二: 不喜欢的事直接说"若若不想"。
