---
变量更新规则:
  ${董壹萌|黑塔|薇薇安|路曼曼|苏颜|倩倩|若若|露西|雅雪|花火|美游}.好感度:
    type: number
    range: 0~100
    category:
      0~20: 初识
      20~40: 熟悉
      40~70: 暧昧
      70~100: 亲密
    check:
      - 日常互动小幅增减 ±(1~3)
      - 关键事件（共同经历、冲突化解、坦诚等）可跳变 ±(5~10)
      - 长时间无互动不自动衰减
  ${董壹萌|黑塔|薇薇安|路曼曼|苏颜|倩倩|若若|露西|雅雪|花火|美游}.亲密度:
    type: number
    range: 0~100
    check:
      - 肢体接触、独处、分享隐私等亲密行为后增加 +(2~5)
      - 争吵、误解、被拒绝后减少 -(2~5)
      - 亲密度通常低于好感度
  ${董壹萌|黑塔|薇薇安|路曼曼|苏颜|倩倩|若若|露西|雅雪|花火|美游}.信任度:
    type: number
    range: 0~100
    check:
      - 坦诚、守信、帮助行为 +(3~8)
      - 欺骗、食言、背叛 -(10~20)
      - 信任度影响角色是否主动分享内心想法
  ${董壹萌|黑塔|薇薇安|路曼曼|苏颜|倩倩|若若|露西|雅雪|花火|美游}.欲望值:
    type: number
    range: 0~100
    category:
      0~20: 淡然
      20~50: 萌动
      50~80: 渴望
      80~100: 难耐
    check:
      - 与好感度独立变化，可高于或低于好感度
      - 暧昧氛围、肢体接触、独处等情境 +(3~8)
      - 被拒绝、冷落、尴尬场面 -(3~10)
      - 未攻略角色初始通常为 0，随关系深化才萌动
      - 已攻略角色初始可有基础值
  ${董壹萌|黑塔|薇薇安|路曼曼|苏颜|倩倩|若若|露西|雅雪|花火|美游}.关系阶段:
    type: '初识'|'熟悉'|'暧昧'|'亲密'
    check:
      - 好感度突破 20 升至熟悉，突破 40 升至暧昧，突破 70 升至亲密
      - 好感度跌破阈值时回落，但亲密→暧昧不轻易回退
  ${董壹萌|黑塔|薇薇安|路曼曼|苏颜|倩倩|若若|露西|雅雪|花火|美游}.攻略状态:
    type: '未攻略'|'攻略中'|'已攻略'
    check:
      - 关系阶段进入暧昧时切换为攻略中
      - 关系阶段达到亲密且剧情有明确确认时切换为已攻略
      - 已攻略状态不回退
  系统.日期:
    format: YYYY/MM/DD
    check:
      - 时间推进时更新，跨度大需说明原因
  系统.时间段:
    type: '早晨'|'上午'|'午间'|'下午'|'放学后'|'夜晚'
    check:
      - 按剧情自然推进切换
  系统.当前位置:
    check:
      - <user>移动到新场景时更新
  近期事件:
    type: string[]
    check:
      - 记录最近 3~5 条关键互动事件
      - 旧的超出 5 条的事件移出数组
      - 每条简短描述，含涉及角色和事件要点
  当前涉及角色:
    type: string[]
    check:
      - 只包含当前剧情中实际出场并与<user>有互动的角色名
      - 口头提及、被谈论但未出场的角色不计入
      - 每条回复根据当前场景实际出场情况更新
      - 角色离场后从列表移除
      - 前端状态栏只展示此列表中的角色面板
  便签:
    type: |-
      {
        角色: string;
        内容: string;
        时间: string;
      }
    check:
      - 当<user>与角色达成邀约、见面约定、承诺等时新增条目
      - 约定完成或取消后删除对应条目
      - 角色字段写角色名，内容字段写约定事项，时间字段写约定的日期或时间段
      - 未约定时保持空数组
  行动选项:
    type: |-
      {
        标题: string;
        描述: string;
      }
    check:
      - 每条回复末尾输出 4 个不同的剧情选项供玩家选择
      - 4 个选项应覆盖不同方向（如亲近/冲突/观察/回避等）
      - 标题用简短词组（2~6字），描述用一句话说明该选项的具体行动
      - 新回复输出时覆盖上一组选项
