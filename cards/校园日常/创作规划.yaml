mvu:
  structure: |
    顶层结构：
    ├── 系统
    │   ├── 日期
    │   ├── 时间段
    │   └── 当前位置
    ├── 当前涉及角色（数组，AI标记实际出场角色）
    ├── 便签（数组，记录邀约/约定）
    ├── 行动选项（数组，AI输出4个剧情选项）
    ├── 董壹萌
    │   ├── 好感度
    │   ├── 欲望值
    │   ├── 亲密度
    │   ├── 信任度
    │   ├── 关系阶段
    │   └── 攻略状态
    ├── 黑塔（同上6字段）
    ├── 薇薇安（同上6字段）
    ├── 路曼曼（同上6字段）
    ├── 苏颜（同上6字段）
    ├── 倩倩（同上6字段）
    ├── 若若（同上6字段）
    ├── 露西（同上6字段）
    ├── 雅雪（同上6字段）
    ├── 花火（同上6字段）
    ├── 美游（同上6字段）
    └── 近期事件
        └── (数组，记录近期关键互动事件)
  variables:
    - path: 系统.日期
      type: string
      format: YYYY/MM/DD
      description: 当前日期
    - path: 系统.时间段
      type: string
      description: 早晨/上午/午间/下午/放学后/夜晚
    - path: 系统.当前位置
      type: string
      description: 当前所在场景
    - path: 当前涉及角色
      type: z.array
      description: AI标记的当前剧情实际出场角色名列表
    - path: 便签
      type: z.array
      description: 邀约/约定记录，每条含角色/内容/时间
    - path: 行动选项
      type: z.array
      description: AI每条回复输出4个剧情选项，每条含标题/描述
    # 以下为每个角色的6维度状态，共11组 # 待细化
    - path: '{角色名}.好感度'
      type: number
      range: 0~100
      description: 角色对<user>的好感度
    - path: '{角色名}.欲望值'
      type: number
      range: 0~100
      description: 角色对<user>的欲望程度，与好感度独立
    - path: '{角色名}.亲密度'
      type: number
      range: 0~100
      description: 角色与<user>的亲密程度
    - path: '{角色名}.信任度'
      type: number
      range: 0~100
      description: 角色对<user>的信任程度
    - path: '{角色名}.关系阶段'
      type: string
      description: 初识/熟悉/暧昧/亲密
    - path: '{角色名}.攻略状态'
      type: string
      description: 未攻略/攻略中/已攻略
    - path: 近期事件
      type: z.array
      description: 近期发生的关键互动事件列表

